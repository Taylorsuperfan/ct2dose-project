[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct2dose"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "pandas",
  "pyyaml",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
